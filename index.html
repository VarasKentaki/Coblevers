<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cobblemon Drops Dex</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <h1>🎮 Cobblemon Drops Dex</h1>

      <div class="controls">
        <input id="search" placeholder="Buscar Pokémon, drop..." />

        <select id="sort">
          <option value="number">Número</option>
          <option value="name">Nombre</option>
        </select>

        <select id="genFilter">
          <option value="">Todas</option>
          <option value="1">Kanto</option>
          <option value="2">Johto</option>
          <option value="3">Hoenn</option>
          <option value="4">Sinnoh</option>
          <option value="5">Teselia</option>
          <option value="6">Kalos</option>
          <option value="7">Alola</option>
          <option value="8">Galar</option>
          <option value="9">Paldea</option>
        </select>
      </div>
    </header>

    <section class="stats">
      <div id="totalPokemon"></div>
      <div id="totalDrops"></div>
    </section>

    <div id="grid"></div>

    <div id="modal" class="hidden">
      <div class="content">
        <button id="close" class="btn">Cerrar</button>

        <div id="modalBody"></div>
      </div>
    </div>

    <button id="topBtn">⬆</button>

    <script src="./js/app.js"></script>
  </body>
</html>
